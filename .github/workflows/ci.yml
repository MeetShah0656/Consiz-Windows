# Runs on every push and pull request: the unit tests (the app is Windows-only, so they run on Windows) and a scan
# for secrets that must never be pushed. The packaged exe is checked by scripts/smoke_ui.py on a developer's PC.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/secret_scan.py

  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      - run: python -m pip install -r requirements.txt -r server/requirements.txt
      - run: python -m pytest tests -q -p no:cacheprovider
