services:
  - type: web
    name: conciz-server
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENROUTER_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: GOOGLE_CLIENT_ID
        sync: false          # same Desktop client ID the app uses
      - key: DATABASE_URL
        sync: false          # free Postgres (e.g. neon.tech) so daily counts survive restarts
      - key: DAILY_LIMIT
        value: "50"
      - key: IP_DAILY_LIMIT
        value: "300"
      - key: RATE_PER_MIN
        value: "12"
      - key: ALLOWED_EMAILS
        sync: false          # optional: comma-separated emails; empty = any verified Google account
